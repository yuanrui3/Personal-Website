<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 560" width="680" height="560" font-family="Lato, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1772d0"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="560" fill="#ffffff"/>

  <!-- Actor -->
  <rect x="20" y="14" width="560" height="128" rx="10" fill="#eef5fc" stroke="#1772d0" stroke-width="2"/>
  <text x="36" y="40" font-size="17" font-weight="700" fill="#1772d0">The AI actor</text>
  <g font-size="13" fill="#222">
    <rect x="36" y="52" width="164" height="76" rx="6" fill="#fff" stroke="#1772d0"/>
    <text x="48" y="74" font-weight="700">Identity core</text>
    <text x="48" y="93">face, voice, persona</text>
    <text x="48" y="111" fill="#666">locked (the cornerstone)</text>

    <rect x="212" y="52" width="164" height="76" rx="6" fill="#fff" stroke="#1772d0"/>
    <text x="224" y="74" font-weight="700">Role add-on</text>
    <text x="224" y="93">this film's character</text>
    <text x="224" y="111" fill="#666">swappable (the narrative)</text>

    <rect x="388" y="52" width="176" height="76" rx="6" fill="#fff" stroke="#1772d0"/>
    <text x="400" y="74" font-weight="700">Memories</text>
    <text x="400" y="93">continuity · past notes</text>
    <text x="400" y="111">craft (updated slowly)</text>
  </g>

  <!-- arrows to outputs -->
  <line x1="300" y1="142" x2="300" y2="166" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- Performance outputs -->
  <g font-size="13" fill="#222">
    <rect x="20" y="170" width="176" height="62" rx="6" fill="#fff" stroke="#9a9a9a"/>
    <text x="32" y="193" font-weight="700">① Beat notes</text>
    <text x="32" y="213" fill="#666">text in the shot prompt</text>

    <rect x="212" y="170" width="176" height="62" rx="6" fill="#fff" stroke="#1772d0" stroke-width="2"/>
    <text x="224" y="193" font-weight="700">② Line reading</text>
    <text x="224" y="213" fill="#666">pauses, breaths, timing</text>

    <rect x="404" y="170" width="176" height="62" rx="6" fill="#fff" stroke="#1772d0" stroke-width="2"/>
    <text x="416" y="193" font-weight="700">③ Gaze, body, face</text>
    <text x="416" y="213" fill="#666">motion you can replay</text>
  </g>
  <text x="20" y="252" font-size="12" fill="#666">The performance: what the actor decides, before any pixels exist</text>

  <line x1="300" y1="258" x2="300" y2="280" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- Coordinator -->
  <rect x="20" y="284" width="560" height="52" rx="6" fill="#fff" stroke="#555"/>
  <text x="36" y="307" font-size="14" font-weight="700" fill="#222">Scene coordinator</text>
  <text x="36" y="326" font-size="13" fill="#666">shared clock, eyelines, props, and who knows what at this point in the story</text>

  <line x1="300" y1="336" x2="300" y2="358" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- Renderer -->
  <rect x="20" y="362" width="560" height="52" rx="6" fill="#fff" stroke="#555"/>
  <text x="36" y="385" font-size="14" font-weight="700" fill="#222">Renderer: the video model</text>
  <text x="36" y="404" font-size="13" fill="#666">lighting, camera, skin and fabric, plus ④ an optional actor-specific add-on</text>

  <line x1="300" y1="414" x2="300" y2="436" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- Review -->
  <rect x="20" y="440" width="560" height="52" rx="6" fill="#fff" stroke="#555"/>
  <text x="36" y="463" font-size="14" font-weight="700" fill="#222">Rendered take, checked against what the actor intended</text>
  <text x="36" y="482" font-size="13" fill="#666">director's notes and blind comparisons, with the renderer held fixed</text>

  <!-- feedback loop -->
  <path d="M580,466 L640,466 L640,90 L568,90" fill="none" stroke="#1772d0" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrb)"/>
  <text x="648" y="300" font-size="12" fill="#1772d0" transform="rotate(90 648 300)" text-anchor="middle">feedback: consolidate only what tests prove</text>

  <text x="20" y="522" font-size="12" fill="#666">⑤ The alternative: each actor as an agent inside a simulated world, reacting in real time.</text>
  <text x="20" y="540" font-size="12" fill="#666">Google's Genie 3 world model recalls about a minute of what it has shown, so this is still research.</text>
</svg>
